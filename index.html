<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Inventario y Ventas</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>
  <body>
    <div class="app-container">
      <main class="main-container">
        <section id="products" class="tab-content active">
          <div class="section-header">
            <h2>Gestión de Productos</h2>
            <button class="btn btn-primary" id="add-product-btn">
              Agregar Producto
            </button>
          </div>

          <div class="table-container">
            <table class="table" id="products-table">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Descripción</th>
                  <th>Cantidad</th>
                  <th>Precio Costo</th>
                  <th>Precio Venta</th>
                  <th>Ganancia %</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="product-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="product-modal-title">Agregar Producto</h3>
          <span class="close">&times;</span>
        </div>
        <form id="product-form">
          <div class="form-group">
            <label for="product-name">Nombre del Producto</label>
            <input type="text" id="product-name" required />
          </div>

          <div class="form-group">
            <label for="product-description">Descripción</label>
            <textarea id="product-description" rows="3"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="product-quantity">Cantidad</label>
              <input type="number" id="product-quantity" required min="0" />
            </div>

            <div class="form-group">
              <label for="product-cost">Precio Costo (sin IVA)</label>
              <input
                type="number"
                id="product-cost"
                step="0.01"
                min="0"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="product-sale">Precio Venta</label>
              <input
                type="number"
                id="product-sale"
                step="0.01"
                min="0"
                required
              />
            </div>

            <div class="form-group">
              <label for="product-profit">Ganancia %</label>
              <input
                type="number"
                id="product-profit"
                step="0.01"
                min="0"
                required
                readonly
              />
            </div>

            <div class="modal-actions">
              <button type="button" class="btn btn-secondary close">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <script src="js/utils/calculations.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/models/product.js"></script>
    <script src="js/views/productView.js"></script>
    <script src="js/controllers/productController.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
